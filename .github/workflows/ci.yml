name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # CPU-only PyTorch first, so sentence-transformers does not pull the multi-GB CUDA build.
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      # Tests use a fake embedder, fake verifier and mocked Groq: no model downloads, no API key.
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t cacheguard:ci .
      - name: Start container and check it serves the demo and metrics
        run: |
          docker run -d --name cg -p 8000:8000 -e CACHEGUARD_BACKEND=mock cacheguard:ci
          for i in $(seq 1 60); do curl -fs localhost:8000/health && break; sleep 3; done
          curl -fs localhost:8000/ | grep -q CacheGuard
          curl -fs -X POST localhost:8000/query -H 'Content-Type: application/json' -d '{"query":"what is a cache"}' | grep -q '"cache_hit":false'
          curl -fs localhost:8000/metrics | grep -q cacheguard_lookups_total
      - if: failure()
        run: docker logs cg || true
